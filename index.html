    Promise.allSettled(pending).then(()=>{if(scene.isDisposed===true)return;if(!player.ready){modal('ASSET LOAD FAILED','Nixon could not be loaded. Check your connection and Run again.',[]);return;}modal('THE CRUCIBLE PROTOCOL','Nixon J. Ackerman — Asset L472\nRecover three classified dossiers. Find the bypass key. Escape the testing sector.\n\nWASD / arrows: move · X: talk · B: bluff · V: sedate'+(loadFailures.length?'\nUnavailable assets: '+loadFailures.join(', '):''),[['Enter the sector',resume]]);});
    scene.onBeforeRenderObservable.add(()=>{
      const rect=canvas.getBoundingClientRect();Object.assign(overlay.style,{left:rect.left+'px',top:rect.top+'px',width:rect.width+'px',height:rect.height+'px'});
      let dt=Math.min(engine.getDeltaTime()/1000,.05);elapsed+=dt;let p=player.root.position;
      if(state.mode==='play'){
        for(let k of ['stun','hit','bluff','toast'])state[k]=Math.max(0,state[k]-dt);if(!state.toast)$('toast').textContent='';
        let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dz=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0),len=Math.hypot(dx,dz);
        const before=p.clone();if(len){move(player,dx/len*5.8*dt,dz/len*5.8*dt);player.root.rotation.y=Math.atan2(dx,dz)+Math.PI;}animate(player,elapsed,BABYLON.Vector3.Distance(before,p)>.001,state.trauma>=75);
        state.ego=Math.max(0,state.ego-.25*dt);if(state.ego<=30)state.trauma+=2.4*dt;
        if(triggers.some(t=>BABYLON.Vector3.Distance(p,t)<2.2))state.trauma+=8*dt;
        for(const item of pickups){if(!item.taken){item.root.rotation.y+=dt*.9;item.root.position.y=.48+Math.sin(elapsed*2)*.1;if(BABYLON.Vector3.Distance(p,item.root.position)<.95){item.taken=true;item.root.setEnabled(false);if(item.type==='file'){state.files++;toast('Dossier secured. '+state.files+'/3');}else{state.meds++;toast('Medication +1.');}}}}
        let ep=enemy.root.position;let chase=BABYLON.Vector3.Distance(p,ep)<(state.boost?25:13);
        if(enemy.ready&&chase&&state.stun<=0){pathTimer-=dt;if(pathTimer<=0){route=findPath(ep,p);pathTimer=.38;}let target=route.length?pos(...route[0]):p;let vx=target.x-ep.x,vz=target.z-ep.z,d=Math.hypot(vx,vz);if(d<.25&&route.length)route.shift();else if(d>.05){let speed=state.boost?3.5:2.9;move(enemy,vx/d*Math.min(speed*dt,d),vz/d*Math.min(speed*dt,d));enemy.root.rotation.y=Math.atan2(vx,vz)+Math.PI;}animate(enemy,elapsed,true);if(BABYLON.Vector3.Distance(ep,p)<1&&state.hit<=0){state.trauma+=25;state.ego=Math.max(0,state.ego-10);state.hit=2;toast('Caught! Trauma +25.');}}else animate(enemy,elapsed,false);
        if(BABYLON.Vector3.Distance(p,exit)<1.3){if(state.files>=3&&state.key)finish(true);else if(elapsed-lastHint>3){toast('Locked: need 3 dossiers + bypass key.');lastHint=elapsed;}}
        if(state.mode==='play'&&state.trauma>=100){state.trauma=100;finish(false);}
      }
      let fear=effects?Math.max(0,Math.min(1,(state.trauma-25)/75)):0;
      $('dread').style.opacity=String(.32+fear*.50);$('dread').style.boxShadow='inset 0 0 '+(95+fear*50)+'px '+(8+fear*15)+'px rgba(26,10,15,.8)';
      image.exposure=.95-fear*.12;image.contrast=1.19+fear*.12;scene.fogDensity=.012+fear*.022;
      let desired=p.add(V(fear*.10*Math.sin(elapsed*.9),overview?8.5:3.7,overview?-7.8:-4.3));camera.position=BABYLON.Vector3.Lerp(camera.position,desired,Math.min(1,dt*5));camera.setTarget(p.add(V(0,overview?.6:1.12,overview?1.1:.65)));updateCutaway();taskLight.position=p.add(V(-.8,2.75,-1.2));
      let thought=$('thought');const phrases=['You signed it.','A necessary sacrifice.','They cannot prove anything.','Control is an illusion.'];thought.textContent=phrases[Math.floor(elapsed/9)%phrases.length];thought.style.opacity=state.mode==='play'&&fear>.32?String(fear*.9*Math.max(0,Math.sin(elapsed*.36))):'0';
      $('e').textContent=Math.round(state.ego);$('t').textContent=Math.round(state.trauma);$('eb').style.width=state.ego+'%';$('tb').style.width=Math.min(100,state.trauma)+'%';$('items').textContent='DOSSIERS '+state.files+'/3 · MEDS '+state.meds+' · KEY '+(state.key?'YES':'NO');
    });
    return scene;
};

try{const canvas=document.getElementById('renderCanvas');window.engine=new BABYLON.Engine(canvas,true,{preserveDrawingBuffer:true,stencil:true});const scene=createScene();document.getElementById('loadstatus').remove();engine.runRenderLoop(()=>scene.render());window.addEventListener('resize',()=>engine.resize());}catch(err){document.getElementById('loadstatus').textContent='Unable to start: '+err.message+' — check your internet connection, then reload.';}
</script></body></html>
